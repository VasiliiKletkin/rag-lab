name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: uv sync --locked
      - name: Линтер ruff
        run: uv run ruff check .
      - name: Форматирование ruff
        run: uv run ruff format --check .
      - name: Тесты
        run: uv run pytest -q
