[project]
name = "rag-lab"
version = "0.1.0"
description = "Практическая лаборатория по RAG: эмбеддинги, pgvector/Qdrant, LangChain/LlamaIndex, evals, агенты и MCP на FastAPI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vasilii Kletkin", email = "kletkinvasilii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "llama-index-core>=0.14.25",
    "llama-index-llms-anthropic>=0.12.3",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: тесты, которые грузят настоящую модель"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # папка alembic/ в проекте — не пакет
