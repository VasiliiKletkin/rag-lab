[project]
name = "rag-lab"
version = "0.1.0"
description = "Hands-on lab: RAG, embeddings, pgvector/Qdrant, LangChain/LlamaIndex, evals, agents and MCP on a FastAPI backend."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vasilii Kletkin", email = "kletkinvasilii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
